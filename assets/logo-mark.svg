  <!-- spark accent -->
  <path d="M46.5 9.5 l1.6 4.2 4.2 1.6 -4.2 1.6 -1.6 4.2 -1.6 -4.2 -4.2 -1.6 4.2 -1.6 Z" fill="#dbeafe" opacity="0.95"/>
