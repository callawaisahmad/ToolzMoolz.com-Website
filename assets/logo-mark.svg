<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ToolzMoolz">
  <title>ToolzMoolz</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="url(#g)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- wrench crossbar (the T crossbar) with open-end jaw slots -->
